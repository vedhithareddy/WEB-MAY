<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .products{
            display: grid;
            /* grid-template-columns: repeat(No of Column , Size of each column); */
            grid-template-columns: repeat(auto-fit , minmax(200px , 1fr));
            background-color: aqua;
            padding: 10px;
            gap: 10px;
        }
        .box{
            border: 1px solid black;
            background-color: aquamarine;
            padding: 10px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="products">
        <div class="box">Cake</div>
        <div class="box">Price:$20</div>
        <div class="box">Cookie</div>
        <div class="box">Price:$25</div>
        <div class="box">Donut</div>
        <div class="box">Price:$30</div>
    </div>
</body>
</html>
